services:

  backend:
    image: devops-backend:v3
    container_name: devops-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    depends_on:
      database:
        condition: service_healthy

    environment:
      DB_HOST: database
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}

  frontend:
    image: devops-frontend:v2
    container_name: devops-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      - backend

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devops-database

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:

  sqlserver-data: